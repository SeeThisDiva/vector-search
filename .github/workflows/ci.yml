name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Check Rust formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy linter
        run: |
          cargo clippy --all-targets -- -D warnings
          cargo clippy --all-targets --features instrument -- -D warnings

      - name: Run Rust test suite (release)
        run: |
          cargo test --release
          cargo test --release --features instrument --test challenge_m1_p35_tests --test rust_phase3_tests --test rust_filtered_counters_tests

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build Rust release binaries
        run: cargo build --release --bin phase1 --bin filtered_exact_knn --bin phase5 --bin phase6

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Ruff Linter
        run: |
          ruff check .

      - name: Run Mypy Type Checker
        run: |
          mypy --config-file mypy.ini src tests scripts

      - name: Run Pytest & Cross-Language Parity Suite
        run: |
          set -o pipefail
          python -m pytest tests/ -rs --cov=src --cov-report=term-missing | tee pytest_output.txt
          if grep -Eq "[0-9]+ skipped|SKIPPED" pytest_output.txt; then
            echo "ERROR: Skipped test detected in pytest output (parity tests must never skip in CI)." >&2
            exit 1
          fi
