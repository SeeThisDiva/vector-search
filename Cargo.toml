[package]
name = "vector-search"
version = "0.1.0"
edition = "2021"
description = "From-scratch HNSW Approximate Nearest Neighbor Search and Brute-Force Ground Truth Benchmark Harness"
license = "MIT"
rust-version = "1.88"
readme = "README.md"

[lib]
name = "vector_search"
path = "src/lib.rs"

[[bin]]
name = "phase1"
path = "src/main.rs"

[[bin]]
name = "phase2"
path = "src/bin/phase2.rs"

[[bin]]
name = "phase3"
path = "src/bin/phase3.rs"

[[bin]]
name = "phase4"
path = "src/bin/phase4.rs"

[features]
default = []
instrument = []

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

