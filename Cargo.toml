[package]
name = "vector-search"
version = "0.1.0"
edition = "2021"
description = "From-scratch HNSW Approximate Nearest Neighbor Search and Brute-Force Ground Truth Benchmark Harness"
license = "MIT"
readme = "README.md"

[lib]
name = "vector_search"
path = "src/lib.rs"

[[bin]]
name = "phase1"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
